name: Release

# Releases with release-please: every push on main creates or updates a release PR (version and
# CHANGELOG computed from Conventional Commits); merging it creates the vX.Y.Z tag and the GitHub
# release. With `is_auto_merged`, auto-merge is enabled on the release PR, so it merges itself as
# soon as its checks pass: every releasable merge on main ships without manual action.
# Publishing or deploying is up to the caller: chain a job on the outputs
# (`if: needs.release.outputs.release_created == 'true'`).
on:
  workflow_call:
    inputs:
      is_auto_merged:
        description: 'Enable auto-merge (squash) on the release PR: release on every releasable merge.'
        type: boolean
        default: false
    secrets:
      RELEASE_TOKEN:
        description: 'Fine-grained PAT (Contents, Pull requests, Issues: read and write). GITHUB_TOKEN would not trigger the CI of the release PR, nor this workflow when it merges.'
        required: true
    outputs:
      release_created:
        description: "'true' when this run created a release."
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: 'Tag of the created release (e.g. v1.2.0).'
        value: ${{ jobs.release.outputs.tag_name }}
      sha:
        description: 'Released commit SHA.'
        value: ${{ jobs.release.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      # `pr` is only set when this run created or updated the release PR. Auto-merge needs
      # "Allow auto-merge" in the repository settings. The PR JSON is parsed in the shell, not with
      # fromJSON(): step expressions are evaluated even when `if` is false, and fromJSON('') fails
      # the whole job on the run that creates the release (no PR then).
      - name: Enable auto-merge on the release PR
        if: ${{ inputs.is_auto_merged && steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr merge "$(jq -r '.number' <<< "$PR_JSON")" --repo "$REPO" --auto --squash
