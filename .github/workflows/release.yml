name: Automatic Release

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: 'lts/*'
      is_build:
        type: boolean
        default: true
      is_publish:
        type: boolean
        default: false
    secrets:
      SEMANTIC_BOT_APP_ID:
        required: true
      SEMANTIC_BOT_PRIVATE_KEY:
        required: true
      NPM_TOKEN:
        description: 'npm token, only needed when publishing without npm trusted publishing (OIDC).'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SEMANTIC_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_BOT_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        if: ${{ inputs.is_build }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Release and publish
        run: npx semantic-release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ inputs.is_publish }}
