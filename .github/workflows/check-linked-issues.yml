# Deprecated: use pr-checks.yml instead. Kept so existing callers don't break;
# it will be removed in a future major version.
name: Check Linked Issue

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-linked-issue:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check if PR is linked to an issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.warning('check-linked-issues.yml is deprecated, use pr-checks.yml instead.');

            // Fetch the issues the PR will close via the GraphQL API
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.issue.number
            });

            if (result.repository.pullRequest.closingIssuesReferences.nodes.length === 0) {
              core.setFailed('❌ This PR must be linked to an issue. Use the "Development" section in the sidebar or add "Closes #<issue>" to the description.');
            }
