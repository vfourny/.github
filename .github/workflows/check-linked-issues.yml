name: Check Linked Issue

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-linked-issue:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check if PR is linked to an issue
        uses: actions/github-script@v8
        with:
          script: |
            // Fetch the issues the PR will close via the GraphQL API
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        title
                      }
                    }
                  }
                }
              }
            `;

            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.issue.number
            };

            const result = await github.graphql(query, variables);
            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (linkedIssues.length === 0) {
              core.setFailed('❌ This PR must be linked to an issue. Use the "Development" section in the sidebar or add "Closes #<issue>" to the description.');
            }
