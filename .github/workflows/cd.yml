name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] -- actionlint does not support "$/" yet
    with:
      is_auto_merged: true
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
