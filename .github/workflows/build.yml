name: Build

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: 'lts/*'
      is_build:
        type: boolean
        default: true
      is_build_upload:
        type: boolean
        default: true
      is_type_checked:
        type: boolean
        default: true
      is_tested:
        type: boolean
        default: true
      is_pr_title_checked:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run format:check

      - name: Check linter
        run: npm run lint

      - name: Validate PR title with commitlint
        if: ${{ inputs.is_pr_title_checked && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

      - name: Build
        if: ${{ inputs.is_build }}
        run: npm run build

      - name: Check types
        if: ${{ inputs.is_type_checked }}
        run: npm run ts:check

      - name: Check tests
        if: ${{ inputs.is_tested }}
        run: npm run test

      - name: Upload build artifact
        if: ${{ inputs.is_build && inputs.is_build_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
