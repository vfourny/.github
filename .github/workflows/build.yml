name: Build

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: 'lts/*'
      package_manager:
        description: "'npm' or 'pnpm' (pnpm version read from the packageManager field of package.json)."
        type: string
        default: 'npm'
      is_build:
        type: boolean
        default: true
      is_build_upload:
        type: boolean
        default: true
      env_file:
        description: 'File copied to .env before the checks (e.g. .env.sample), for builds that validate env at load time.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env from template
        if: ${{ inputs.env_file != '' }}
        run: cp "$ENV_FILE" .env
        env:
          ENV_FILE: ${{ inputs.env_file }}

      - name: Setup pnpm
        if: ${{ inputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package_manager != 'pnpm' }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package_manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Check format
        run: ${PACKAGE_MANAGER} run --if-present format:check
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Check linter
        run: ${PACKAGE_MANAGER} run --if-present lint
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Check unused code (knip)
        run: ${PACKAGE_MANAGER} run --if-present knip
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Check types
        run: ${PACKAGE_MANAGER} run --if-present ts:check
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Build
        if: ${{ inputs.is_build }}
        run: ${PACKAGE_MANAGER} run build
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Check tests
        run: ${PACKAGE_MANAGER} run --if-present test
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}

      - name: Upload build artifact
        if: ${{ inputs.is_build && inputs.is_build_upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
