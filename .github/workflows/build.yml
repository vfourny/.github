name: Build

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: 'lts/*'
      is_build:
        type: boolean
        default: true
      is_build_upload:
        type: boolean
        default: true
      is_type_checked:
        type: boolean
        default: true
      is_tested:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run format:check

      - name: Check linter
        run: npm run lint

      - name: Check types
        if: ${{ inputs.is_type_checked }}
        run: npm run ts:check

      - name: Build
        if: ${{ inputs.is_build }}
        run: npm run build

      - name: Check tests
        if: ${{ inputs.is_tested }}
        run: npm run test

      - name: Upload build artifact
        if: ${{ inputs.is_build && inputs.is_build_upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
