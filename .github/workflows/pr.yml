name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-checks:
    uses: ./.github/workflows/pr-checks.yml # zizmor: ignore[self-repository] -- actionlint does not support "$/" yet
    # Required even when a job is skipped: GitHub validates them at startup
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      # Config repository maintained solo: most PRs (including Renovate's) have no issue
      is_linked_issue_checked: false
