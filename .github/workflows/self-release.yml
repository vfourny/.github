name: Self release

# This repository releases itself with its own reusable release.yml (auto-merged release PR).
# Not named release.yml: that name is the reusable workflow called by the other repositories.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] -- actionlint does not support "$/" yet
    with:
      is_auto_merged: true
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
