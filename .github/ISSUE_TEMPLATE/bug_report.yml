name: Bug Report
description: Report a bug or unexpected behaviour.
title: "[Bug]: "
labels:
  - bug
assignees:
  - vfourny
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: "A bug happened!"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the project are you running?
      placeholder: "1.2.3 or commit SHA"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, or anything else relevant.
      placeholder: |
        - OS: macOS 15
        - Browser: Firefox 140
        - Node.js: 22.x
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs or error messages here (automatically formatted as code).
      render: shell
